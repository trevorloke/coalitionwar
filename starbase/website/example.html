<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starbase website embed — example</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
  form { display: grid; gap: 10px; padding: 16px; border: 1px solid #ddd; border-radius: 12px; margin-bottom: 24px; }
  input, textarea, button { font: inherit; padding: 10px; border-radius: 8px; border: 1px solid #ccc; }
  button { background: #6d4aff; color: #fff; border: 0; font-weight: 600; cursor: pointer; }
  .stats b { font-size: 1.4rem; }
</style>
</head>
<body>
<!--
  Example of the Imagine Surrey website talking to Starbase. Open it at
  http://localhost:8080/embed/example.html?key=pk_... while Starbase runs,
  or copy the markup into the real website and replace data-key.
-->
<h1>Join Imagine Surrey</h1>

<p class="stats">
  <b data-starbase-stat="doors_knocked">0</b> doors knocked ·
  <b data-starbase-stat="volunteers">0</b> volunteers ·
  <b data-starbase-stat="sign_requests">0</b> lawn signs
</p>

<h2>Volunteer</h2>
<form data-starbase-form="volunteer" data-starbase-success="Thanks for volunteering! A team member will reach out.">
  <input name="first_name" placeholder="First name" required>
  <input name="last_name" placeholder="Last name">
  <input name="email" type="email" placeholder="Email" required>
  <input name="phone" type="tel" placeholder="Phone">
  <input name="postal_code" placeholder="Postal code">
  <label><input type="checkbox" name="email_opt_in" value="1" checked> Send me campaign updates</label>
  <button>I want to help</button>
</form>

<h2>Request a lawn sign</h2>
<form data-starbase-form="sign">
  <input name="name" placeholder="Full name" required>
  <input name="email" type="email" placeholder="Email" required>
  <input name="address" placeholder="Street address in Surrey" required>
  <input name="postal_code" placeholder="Postal code">
  <button>Send me a sign</button>
</form>

<script>
  // For this demo page only: take the key from ?key= so it can be tried locally.
  (function () {
    var key = new URLSearchParams(location.search).get('key') || 'pk_REPLACE_ME';
    var s = document.createElement('script');
    s.src = '/embed/starbase.js';
    s.setAttribute('data-key', key);
    s.setAttribute('data-endpoint', location.origin);
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
