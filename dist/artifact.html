<title>Coalition 1939</title>

<style id="app-style">/* Coalition 1939 — war-room at night. Deliberately single-theme: the room is
   dark, the order sheets are paper, the lamps are amber. All colors explicit. */

:root {
  --ground: #131820;
  --panel: #1a212b;
  --panel-2: #212b38;
  --line: #2e3947;
  --ink: #d8d3c3;
  --ink-dim: #8b93a0;
  --accent: #d9a441;
  --accent-dim: #8a6a2f;
  --paper: #e9e1cb;
  --paper-2: #ded4b8;
  --paper-ink: #2a2620;
  --paper-dim: #6b6353;
  --allied: #4a86b8;
  --axis: #b0574e;
  --good: #6da06b;
  --bad: #c25b4e;
  --sea: #1b2836;
  --font-display: 'Oswald', 'Arial Narrow', sans-serif;
  --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
  --font-body: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.45;
}
button {
  font: inherit; cursor: pointer; border: 1px solid var(--line);
  background: var(--panel-2); color: var(--ink);
  padding: 6px 12px; border-radius: 3px;
}
button:hover { border-color: var(--accent-dim); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button.primary {
  background: var(--accent); color: #1a1408; border-color: var(--accent);
  font-family: var(--font-display); text-transform: uppercase;
  letter-spacing: 0.08em; font-weight: 600;
}
button.primary:hover { background: #e6b455; }
button:disabled { opacity: 0.45; cursor: default; }
button.danger { border-color: var(--bad); color: var(--bad); }
input, select {
  font: inherit; background: var(--ground); color: var(--ink);
  border: 1px solid var(--line); border-radius: 3px; padding: 5px 8px;
}
input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

h1, h2, h3, .display {
  font-family: var(--font-display); text-transform: uppercase;
  letter-spacing: 0.06em; font-weight: 600; margin: 0;
  text-wrap: balance;
}
.mono { font-family: var(--font-mono); }
.dim { color: var(--ink-dim); }
.small { font-size: 12px; }

#app { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* ——— setup screen ——— */
.setup {
  max-width: 880px; margin: 0 auto; padding: 40px 24px 80px;
  overflow-y: auto; height: 100vh;
}
.setup .masthead { border-bottom: 3px double var(--line); padding-bottom: 18px; margin-bottom: 24px; }
.setup h1 { font-size: 54px; line-height: 1; color: var(--accent); }
.setup .sub { font-family: var(--font-mono); color: var(--ink-dim); margin-top: 8px; font-size: 13px; }
.seat-table { width: 100%; border-collapse: collapse; margin: 16px 0; }
.seat-table th {
  font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.1em;
  font-size: 11px; color: var(--ink-dim); text-align: left; padding: 6px 10px;
  border-bottom: 1px solid var(--line); font-weight: 500;
}
.seat-table td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.power-chip {
  display: inline-block; width: 10px; height: 10px; border-radius: 2px;
  margin-right: 8px; vertical-align: baseline;
}
.setup .row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin: 14px 0; }
.setup section { margin: 26px 0; }
.setup h2 { font-size: 18px; color: var(--ink); margin-bottom: 8px; }
.ratings { font-family: var(--font-mono); font-size: 11px; color: var(--ink-dim); }

/* ——— game chrome ——— */
.topbar {
  display: flex; align-items: stretch; gap: 0; border-bottom: 1px solid var(--line);
  background: var(--panel); flex: none;
}
.topbar .brand {
  font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--accent); padding: 10px 16px; font-size: 16px; font-weight: 600;
  border-right: 1px solid var(--line); display: flex; align-items: center; gap: 10px;
}
.topbar .calendar { font-family: var(--font-mono); font-size: 12px; color: var(--ink); }
.phase-rail { display: flex; flex: 1; }
.phase-rail .phase {
  flex: 1; display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.12em;
  font-size: 11px; color: var(--ink-dim); border-right: 1px solid var(--line);
  position: relative; padding: 0 4px; text-align: center;
}
.phase-rail .phase.active { color: #1a1408; background: var(--accent); font-weight: 600; }
.phase-rail .phase.done { color: var(--accent-dim); }
.pools {
  display: flex; align-items: center; gap: 12px; padding: 0 14px;
  font-family: var(--font-mono); font-size: 12px;
}
.pools .allied { color: var(--allied); }
.pools .axis { color: var(--axis); }

.main { flex: 1; display: flex; min-height: 0; }
.map-wrap { flex: 1; position: relative; background: var(--ground); min-width: 0; }
.map-wrap svg { display: block; width: 100%; height: 100%; cursor: grab; }
.map-wrap svg.dragging { cursor: grabbing; }
.theatre-nav {
  position: absolute; top: 10px; left: 10px; display: flex; flex-wrap: wrap; gap: 4px;
  max-width: 70%;
}
.theatre-nav button { font-size: 10px; padding: 3px 8px; opacity: 0.85; }
.map-hint {
  position: absolute; bottom: 10px; left: 10px; font-family: var(--font-mono);
  font-size: 11px; color: var(--ink-dim); background: rgba(19,24,32,0.8);
  padding: 4px 8px; border-radius: 3px; pointer-events: none; max-width: 60%;
}

.sidebar {
  width: 400px; flex: none; border-left: 1px solid var(--line); background: var(--panel);
  display: flex; flex-direction: column; min-height: 0;
}
.sidebar .panel-head {
  padding: 10px 14px; border-bottom: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
}
.sidebar .panel-head h2 { font-size: 15px; }
.sidebar .panel-body { flex: 1; overflow-y: auto; padding: 12px 14px; min-height: 0; }
.sidebar .panel-foot { padding: 10px 14px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; }

.ticker {
  flex: none; height: 96px; border-top: 1px solid var(--line); background: #10141b;
  overflow-y: auto; padding: 6px 12px; font-family: var(--font-mono); font-size: 11.5px;
  color: var(--ink-dim);
}
.ticker .line { white-space: pre-wrap; }
.ticker .line.event { color: var(--accent); }
.ticker .line.battle { color: var(--ink); }

/* ——— order sheet (paper) ——— */
.order-sheet {
  background: var(--paper); color: var(--paper-ink); border-radius: 3px;
  padding: 12px 14px; font-family: var(--font-mono); font-size: 12.5px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.5);
}
.order-sheet h3 {
  font-family: var(--font-display); letter-spacing: 0.1em; font-size: 13px;
  border-bottom: 1px solid var(--paper-dim); padding-bottom: 6px; margin-bottom: 8px;
  color: var(--paper-ink);
}
.order-sheet .order-line {
  display: flex; justify-content: space-between; gap: 8px; padding: 3px 0;
  border-bottom: 1px dotted var(--paper-2);
}
.order-sheet .order-line .x { color: #8a2f22; cursor: pointer; font-weight: 600; }
.order-sheet .budget { margin-top: 8px; display: flex; justify-content: space-between; font-weight: 600; }
.order-sheet .over { color: #8a2f22; }
.order-sheet .stamp {
  margin-top: 10px; text-align: right; color: #8a2f22; font-family: var(--font-display);
  text-transform: uppercase; letter-spacing: 0.2em; font-size: 11px;
}

/* ——— cards ——— */
.card-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.card {
  width: 178px; background: var(--paper); color: var(--paper-ink); border-radius: 4px;
  padding: 8px 10px; font-size: 11.5px; line-height: 1.35;
  border-top: 4px solid var(--paper-dim); position: relative;
}
.card.axis { border-top-color: var(--axis); }
.card.allied { border-top-color: var(--allied); }
.card .card-title { font-family: var(--font-display); font-size: 12.5px; letter-spacing: 0.04em; }
.card .ops-pip {
  position: absolute; top: 6px; right: 8px; font-family: var(--font-display);
  background: var(--paper-ink); color: var(--paper); border-radius: 50%;
  width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;
  font-size: 12px;
}
.card .card-text { margin-top: 4px; color: #4a4437; }
.card .card-actions { margin-top: 6px; display: flex; gap: 6px; }
.card .card-actions button { font-size: 10.5px; padding: 2px 7px; background: var(--paper-2); color: var(--paper-ink); border-color: var(--paper-dim); }

/* ——— dashboards ——— */
.power-row {
  display: grid; grid-template-columns: 14px 1fr auto auto auto; gap: 8px;
  align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line);
  font-family: var(--font-mono); font-size: 12px;
}
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; min-width: 50px; }
.bar > div { height: 100%; background: var(--accent); }
.kv { display: flex; justify-content: space-between; padding: 3px 0; font-family: var(--font-mono); font-size: 12px; }
.kv .k { color: var(--ink-dim); }

.notice {
  background: var(--panel-2); border-left: 3px solid var(--accent);
  padding: 8px 12px; margin: 10px 0; font-size: 13px;
}
.notice.grim { border-left-color: var(--bad); }

/* ——— pass-device cover ——— */
.cover {
  position: fixed; inset: 0; background: var(--ground); z-index: 40;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 18px; text-align: center; padding: 24px;
}
.cover h2 { font-size: 30px; color: var(--accent); }

/* ——— battle report / reveal ——— */
.sheet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sheet-grid .order-sheet { font-size: 11px; padding: 8px 10px; }
.joint-flag { color: var(--accent); font-weight: 600; }

.victory {
  max-width: 700px; margin: 40px auto; padding: 30px; background: var(--panel);
  border: 1px solid var(--line); border-top: 4px solid var(--accent);
}
.victory h1 { font-size: 34px; color: var(--accent); margin-bottom: 6px; }
.victory .rank-row {
  display: flex; justify-content: space-between; padding: 8px 4px;
  border-bottom: 1px solid var(--line); font-family: var(--font-mono);
}
.victory .footnote { margin-top: 16px; color: var(--ink-dim); font-style: italic; }

.modal-back {
  position: fixed; inset: 0; background: rgba(10,13,18,0.75); z-index: 30;
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.modal {
  background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
  max-width: 560px; width: 100%; max-height: 86vh; overflow-y: auto; padding: 18px;
}
.modal h3 { margin-bottom: 10px; }
.modal .row { display: flex; gap: 10px; align-items: center; margin: 10px 0; flex-wrap: wrap; }

@media (max-width: 900px) {
  .main { flex-direction: column; }
  .sidebar { width: 100%; height: 46vh; border-left: none; border-top: 1px solid var(--line); }
  .map-wrap { height: 40vh; }
  .setup h1 { font-size: 36px; }
  .sheet-grid { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) {
  .phase-rail .phase.active { transition: background 0.3s ease; }
}

// Assembles the final map from the skeleton + generated content and validates
// the whole board. The merged territory list is the single map object the
// engine and UI consume.

const { SKELETON, CROSS_EDGES, CORRIDORS, THEATRES, SETUP_BUDGETS } = __req('src/data/skeleton.js');
const { POWERS, NATIONS } = __req('src/data/powers.js');
const { GEN_TERRITORIES } = __req('src/data/generated/territories.js');



const TERRAIN_DEFENSE = new Set(['mountain', 'urban', 'jungle', 'island']);

function buildMap() {
  const map = {};
  for (const sk of SKELETON) {
    const gen = GEN_TERRITORIES[sk.id];
    if (!gen) throw new Error(`missing generated data for territory ${sk.id}`);
    map[sk.id] = {
      ...sk,
      terrain: gen.terrain,
      supply: gen.supply,
      adjacent: new Set(gen.adjacent),
      coords: gen.coords,
      setup: { ...gen.setup },
    };
  }
  // Merge fixed cross-theatre edges, then symmetrize everything.
  for (const [a, b] of CROSS_EDGES) {
    if (!map[a] || !map[b]) throw new Error(`cross edge references unknown territory ${a}-${b}`);
    map[a].adjacent.add(b);
    map[b].adjacent.add(a);
  }
  for (const t of Object.values(map)) {
    for (const n of t.adjacent) {
      if (!map[n]) throw new Error(`${t.id} adjacent to unknown ${n}`);
      map[n].adjacent.add(t.id);
    }
  }
  for (const t of Object.values(map)) t.adjacent = [...t.adjacent].sort();
  return map;
}

function validateMap(map) {
  const errors = [];
  const ids = Object.keys(map);
  if (ids.length !== 96) errors.push(`territory count ${ids.length} != 96`);
  let vcs = 0;
  for (const t of Object.values(map)) {
    if (t.victoryCity) vcs++;
    if (t.type === 'sea' && t.terrain !== 'sea') errors.push(`${t.id}: sea zone with terrain ${t.terrain}`);
    if (t.type === 'land' && t.terrain === 'sea') errors.push(`${t.id}: land with sea terrain`);
    if (t.type === 'sea' && t.supply !== 0) errors.push(`${t.id}: sea zone with supply ${t.supply}`);
    if (t.adjacent.length === 0) errors.push(`${t.id}: isolated`);
    const box = THEATRES[t.theatre].box;
    if (t.coords.x < box.x[0] || t.coords.x > box.x[1] || t.coords.y < box.y[0] || t.coords.y > box.y[1]) {
      errors.push(`${t.id}: coords ${t.coords.x},${t.coords.y} outside ${t.theatre} box`);
    }
    const owner = t.setup.owner;
    const valid = owner === 'none' || owner === 'neutral' || owner === 'france'
      || POWERS[owner] || NATIONS[owner];
    if (!valid) errors.push(`${t.id}: unknown setup owner ${owner}`);
    if (t.type === 'sea' && owner === 'neutral') errors.push(`${t.id}: sea zone owned by neutral`);
  }

  const seen = new Set([ids[0]]);
  const stack = [ids[0]];

    for (const n of map[stack.pop()].adjacent) {

      totals[t.setup.owner] = (totals[t.setup.owner] || 0) + t.setup.strength;

// Deterministic, seedable RNG. Every die, draw, and the coin come from here so
// a game replays identically from its seed. For online play the per-round seed
// is derived from the SHA-256 of all revealed order sheets, which makes the
// dice provably fair: nobody can know them before the commit.

function hashString(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function makeRng(seed) {
  let a = typeof seed === 'string' ? hashString(seed) : seed >>> 0;
  if (a === 0) a = 0x9e3779b9;
  const next = () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  return {
    float: next,
    int(n) { return Math.floor(next() * n); },
    d6() { return 1 + this.int(6); },
    coin() { return next() < 0.5 ? 'heads' : 'tails'; },
    pick(arr) { return arr[this.int(arr.length)]; },
    shuffle(arr) {
      const a2 = arr.slice();
      for (let i = a2.length - 1; i > 0; i--) {
        const j = this.int(i + 1);
        [a2[i], a2[j]] = [a2[j], a2[i]];
      }
      return a2;
    },
    state() { return a >>> 0; },
  };
}

// Core rules helpers: allegiance, supply tracing, corridors, command points,
// hit thresholds. Pure functions over (game, state); no mutation here.

const { TERRAIN_DEFENSE } = __req('src/engine/data.js');

const PHASES = ['intel', 'council', 'orders', 'reveal', 'resolution', 'reckoning'];

const COSTS = {
  move: 1, offensive: 3, naval: 2, entrench: 1, intel_op: 2, lend_lease: 1,
};

const POOL_SPENDS = {
  reroll: 2, initiative: 2, resupply: 3, cancel_event: 4,
};

const BUILD_COSTS = { strength: 2, strength_low_manpower: 3, ship: 3, fort: 2 };
const MAX_COMMIT_PER_POWER = 8; // the 8-strength ceiling
const THRESHOLD_FLOOR = 3;
const THRESHOLD_CEIL = 6;
const MAX_PRODUCTION_BANK = 6;

// ——— allegiance ———

function sideOfPower(state, powerId) {
  return state.powers[powerId].side;
}

// Side of a territory owner tag. Returns 'axis' | 'allied' | 'neutral' | 'none'.
function sideOfOwner(state, owner) {
  if (owner === 'none') return 'none';
  if (owner === 'neutral' || owner === 'vichy') return 'neutral';
  if (owner === 'france') return state.franceFallen ? 'neutral' : 'allied';
  if (state.powers[owner]) {
    const p = state.powers[owner];
    return p.atWar ? p.side : 'neutral';
  }
  if (state.nations[owner]) {
    const n = state.nations[owner];
    return n.allegiance; // 'axis' | 'allied' | 'neutral'
  }
  return 'neutral';
}

// The power seat that commands a territory's units.
function controllerOf(state, owner) {
  if (state.powers[owner]) return owner;
  if (state.nations[owner]) return 'indies';
  if (owner === 'france' && !state.franceFallen) return 'uk';
  return null; // true neutrals, vichy, empty seas
}

function enemies(sideA, sideB) {
  return (sideA === 'axis' && sideB === 'allied') || (sideA === 'allied' && sideB === 'axis');
}

function atWar(state, powerId) {
  return state.powers[powerId].atWar;
}

// Powers a seat currently commands units for (indies → nation tags too).
function ownedTagsOf(state, powerId) {
  const tags = [powerId];
  if (powerId === 'indies') {
    for (const [nid, n] of Object.entries(state.nations)) {
      if (n.sovereign) tags.push(nid);
    }
  }
  if (powerId === 'uk' && !state.franceFallen) tags.push('france');
  return tags;
}

// ——— supply ———

function passableFor(game, state, tid, side) {
  const t = game.map[tid];
  if (t.type === 'sea') {
    const os = sideOfOwner(state, state.t[tid].owner);
    return os === 'none' || os === side || os === 'neutral';
  }
  const os = sideOfOwner(state, state.t[tid].owner);
  return os === side;
}

function corridorEdgeBlocked(game, state, a, b, side) {
  for (const [cid, c] of Object.entries(game.corridors)) {
    for (const [ea, eb] of c.edges) {
      if ((ea === a && eb === b) || (ea === b && eb === a)) {
        // Allied lifeline edges gate on the corridor being open (for the allies).
        if (side === 'allied' && !state.corridors[cid].open) return true;
      }
    }
  }
  return false;
}

// Recompute the `supplied` flag for every land territory.
function traceSupply(game, state) {
  const bySide = { axis: new Set(), allied: new Set() };
  // Sources: industrial territories + capitals, per owning side.
  for (const [tid, ts] of Object.entries(state.t)) {
    const t = game.map[tid];
    const side = sideOfOwner(state, ts.owner);
    if (side !== 'axis' && side !== 'allied') continue;
    if (t.industrial || t.capitalOf) bySide[side].add(tid);
  }
  const reach = { axis: new Set(), allied: new Set() };
  for (const side of ['axis', 'allied']) {
    const stack = [...bySide[side]];
    for (const s of stack) reach[side].add(s);
    while (stack.length) {
      const cur = stack.pop();
      for (const n of game.map[cur].adjacent) {
        if (reach[side].has(n)) continue;
        if (corridorEdgeBlocked(game, state, cur, n, side)) continue;
        if (!passableFor(game, state, n, side)) continue;
        reach[side].add(n);
        stack.push(n);
      }
    }
  }
  for (const [tid, ts] of Object.entries(state.t)) {
    const t = game.map[tid];
    if (t.type === 'sea') { ts.supplied = true; continue; }
    const side = sideOfOwner(state, ts.owner);
    if (side === 'neutral' || side === 'none') { ts.supplied = true; continue; }
    ts.supplied = reach[side].has(tid);
  }
}

// ——— corridors ———

function recomputeCorridors(game, state) {
  for (const [cid, c] of Object.entries(game.corridors)) {
    const endpoints = new Set(c.edges.flat());
    let blocked = false;
    for (const tid of endpoints) {
      const t = game.map[tid];
      const os = sideOfOwner(state, state.t[tid].owner);
      if (t.type === 'sea') { if (os === 'axis') blocked = true; }
      else if (os !== 'allied') blocked = true;
    }
    // Presence: listed powers with strength in or adjacent to an endpoint.
    const present = new Set();
    for (const tid of endpoints) {
      const zone = [tid, ...game.map[tid].adjacent];
      for (const z of zone) {
        const ts = state.t[z];
        if (ts.strength > 0 && c.powers.includes(ts.owner)) present.add(ts.owner);
        // UK commands France; French presence doesn't count for a corridor.
      }
    }
    const listedAtWar = c.powers.filter(p => state.powers[p] && state.powers[p].atWar);
    const need = listedAtWar.length >= 2 ? 2 : 1;
    let open = !blocked && present.size >= need && state.corridors[cid].forcedClosed === 0;
    // The Burma Road is China's lifeline: it needs China's own presence plus
    // one Western partner — the UK and USA cannot hold it open by themselves.
    if (cid === 'burma_road' && open && state.powers.china.atWar) {
      open = present.has('china') && (present.has('uk') || present.has('usa') || listedAtWar.length === 1);
    }
    state.corridors[cid].open = open;
  }
}

// ——— command points ———

function computeCP(game, state, powerId) {
  const p = state.powers[powerId];
  let supplied = 0, total = 0;
  const tags = ownedTagsOf(state, powerId);
  for (const [tid, ts] of Object.entries(state.t)) {
    if (!tags.includes(ts.owner) || game.map[tid].type === 'sea') continue;
    total++;
    if (ts.supplied) supplied++;
  }
  const supplyBonus = total > 0 && supplied / total >= 0.9 ? 1 : 0;
  let cp = 3 + p.ratings.industry + Math.floor(p.homeFront / 3) + supplyBonus;
  if (p.forcedNegotiation) cp = Math.ceil(cp / 2);
  return Math.max(3, Math.min(12, cp));
}

// ——— thresholds ———

// Attacker hit threshold for a battle (lower = better). Combined operations:
// -1 per allied power beyond the first committing >=1 strength, floor 3.
function attackerThreshold(game, state, battle) {
  let th = 5;
  th -= Math.max(0, battle.attackers.length - 1);
  th += battle.mods?.attacker ?? 0;
  return Math.max(THRESHOLD_FLOOR, Math.min(THRESHOLD_CEIL, th));
}

function defenderThreshold(game, state, battle) {
  const t = game.map[battle.target];
  const ts = state.t[battle.target];
  let th = 5;
  if (TERRAIN_DEFENSE.has(t.terrain)) th -= 1;
  if (ts.fort > 0) th -= 1;
  if (ts.entrenched) th -= 1;
  if (!ts.supplied) th += 1;
  th += battle.mods?.defender ?? 0;
  return Math.max(THRESHOLD_FLOOR, Math.min(THRESHOLD_CEIL, th));
}

function powersActiveInTheatre(game, state, theatre, side) {
  const active = new Set();
  for (const [tid, ts] of Object.entries(state.t)) {
    if (game.map[tid].theatre !== theatre || ts.strength === 0) continue;
    const ctrl = controllerOf(state, ts.owner);
    if (!ctrl) continue;
    if (sideOfOwner(state, ts.owner) === side && state.powers[ctrl].atWar) active.add(ctrl);
  }
  return [...active];
}

    case 'entrench': return COSTS.entrench + (order.withFort ? 1 : 0);
    case 'strat_card': return 0; // ops value ADDS budget; events are free to declare
    case 'ops_card': return game.opsCards[order.cardId]?.cost ?? 1;
    case 'intel_op': return COSTS.intel_op;
    case 'lend_lease': return powerId === 'usa' ? 0 : COSTS.lend_lease; // arsenal
    case 'build': return 0; // paid in production at reckoning
    case 'ultra': return 0;
    case 'decisive_battle': return 0;
    case 'initiative_bid': return 0; // paid from coalition pool
    case 'enter_war': return 0;
    case 'defect': return 0;
    case 'sell_commitment': return 0;
    default: return 0;
  }
}

// Validate a sheet, drop what the budget or the rules don't allow.
// Returns { orders, spent, budget, dropped }. Pass opts.commit = true only
// when actually filing the sheet: it records the power's draw on the shared
// Supreme Commander pots (a dry run for UI costing must not).
function validateSheet(game, state, powerId, sheet, opts = {}) {
  const p = state.powers[powerId];
  const tags = ownedTagsOf(state, powerId);
  const dropped = [];
  const kept = [];
  let budget = p.cp;
  // Commanders are keyed `${theatre}|${side}`. Each office holds ONE pot of
  // 3 CP, shared by the side's OTHER powers for orders in that theatre —
  // never the commander's own.
  const pots = {};
  for (const [key, c] of Object.entries(state.commanders)) {
    if (!c || c.power === powerId || c.side !== sideOfPower(state, powerId)) continue;
    const used = state.commanderSpent?.[key] ?? {};
    const usedByOthers = Object.entries(used)
      .filter(([pid]) => pid !== powerId)
      .reduce((s, [, n]) => s + n, 0);
    pots[key] = { theatre: key.split('|')[0], remaining: Math.max(0, 3 - usedByOthers), used: 0 };
  }

  // At most one strategy card per round; only THAT card's ops can fund the
  // sheet, and only when it is played for ops.
  const firstStrat = sheet.orders.find(o => o.type === 'strat_card' && p.stratHand.includes(o.cardId));
  if (firstStrat?.forOps) budget += game.cards[firstStrat.cardId]?.ops ?? 0;

  let spent = 0, freeMoveUsed = false; // spent may hold halves (interior lines)
  const committedFrom = {}; // territory -> strength already pledged
  for (let o of sheet.orders) {
    const fail = reason => dropped.push({ order: o, reason });
    let cost = orderCost(game, state, powerId, o);

    // Legality checks per type.
    if (o.type === 'move') {
      const from = state.t[o.from], to = state.t[o.to];
      if (!from || !to) { fail('unknown territory'); continue; }
      if (!tags.includes(from.owner)) { fail('not your territory'); continue; }
      const avail = from.strength - (committedFrom[o.from] || 0);
      if (o.strength < 1 || o.strength > avail) { fail('not enough strength'); continue; }
      if (!game.map[o.from].adjacent.includes(o.to)) { fail('not adjacent'); continue; }
      const toSide = sideOfOwner(state, to.owner);
      // A stack's allegiance follows its owner tag (a defected nation fights
      // for the Allies even though the Indies seat writes its orders).
      const moveSide = sideOfOwner(state, from.owner);
      const friendly = to.owner === from.owner || toSide === moveSide
        || (game.map[o.to].type === 'sea' && (to.owner === 'none' || to.strength === 0));
      if (!friendly) { fail('destination not friendly'); continue; }
      if (game.map[o.to].type === 'sea' && game.map[o.from].type === 'land'
        && p.ratings.sea < 2) { fail('no fleet capacity'); continue; }
      if (moveSide === 'neutral' && !tags.includes(to.owner) && to.owner !== 'none') { fail('neutral units stay home'); continue; }
      committedFrom[o.from] = (committedFrom[o.from] || 0) + o.strength;
      if (cost === 1 && !freeMoveUsed && hasDoctrine(game, state, powerId, 'move_discount')) {
        freeMoveUsed = true; cost = 0;
      }
    } else if (o.type === 'offensive') {
      const t = state.t[o.target];
      if (!t) { fail('unknown target'); continue; }
      if (!p.atWar) { fail('neutral cannot attack'); continue; }
      if (kept.some(k => k.type === 'offensive' && k.target === o.target)) {
        fail('already attacking that territory'); continue;
      }
      let total = 0; let ok = true;
      const maxSources = powerId === 'ussr' ? 2 : 1; // deep battle
      if (!o.sources || o.sources.length < 1 || o.sources.length > maxSources) { fail('bad sources'); continue; }
      // The offensive's side is its SOURCES' allegiance, so a defected nation
      // under the Indies seat attacks the Axis, never its new allies.
      const orderSide = o.sources[0] && state.t[o.sources[0].from]
        ? sideOfOwner(state, state.t[o.sources[0].from].owner) : 'none';
      if (orderSide !== 'axis' && orderSide !== 'allied') { fail('those units are not at war'); continue; }
      const targetSide = sideOfOwner(state, t.owner);
      if (targetSide === orderSide) { fail('target friendly'); continue; }
      for (const s of o.sources) {
        const st = state.t[s.from];
        if (!st || !tags.includes(st.owner)
          || sideOfOwner(state, st.owner) !== orderSide) ok = false;
        else if (s.strength < 1 || s.strength > st.strength - (committedFrom[s.from] || 0)) ok = false;
        else if (!o.amphibious && !game.map[s.from].adjacent.includes(o.target)) ok = false;
        else if (o.amphibious) {
          const via = o.via;
          if (!via || !game.map[via] || game.map[via].type !== 'sea') ok = false;
          else if (!game.map[s.from].adjacent.includes(via) || !game.map[via].adjacent.includes(o.target)) ok = false;
          else if (enemies(sideOfOwner(state, state.t[via].owner), orderSide)) ok = false;
        }
        total += s.strength;
      }
      if (!ok) { fail('illegal sources'); continue; }
      if (total > MAX_COMMIT_PER_POWER) { fail('over the 8-strength ceiling'); continue; }
      for (const s of o.sources) committedFrom[s.from] = (committedFrom[s.from] || 0) + s.strength;
      o = { ...o, _side: orderSide };
    } else if (o.type === 'naval' && o.mission === 'bomb') {
      // Strategic bombing: needs the doctrine; hits an enemy industrial
      // territory within two steps of your own ground. Aircraft don't move.
      if (!hasDoctrine(game, state, powerId, 'bombing')) { fail('no bomber command'); continue; }
      const t = game.map[o.zone];
      const ts = state.t[o.zone];
      if (!t || t.type !== 'land' || !t.industrial) { fail('not an industrial target'); continue; }
      if (!enemies(sideOfOwner(state, ts.owner), sideOfPower(state, powerId))) { fail('not an enemy target'); continue; }
      const from = state.t[o.from];
      if (!from || !tags.includes(from.owner) || from.strength < 1) { fail('no air base'); continue; }
      const near = game.map[o.from].adjacent.includes(o.zone)
        || game.map[o.from].adjacent.some(n => game.map[n].adjacent.includes(o.zone));
      if (!near) { fail('out of bombing range'); continue; }
      if (o.strength < 1 || o.strength > 4) { fail('1-4 bomber strength'); continue; }
    } else if (o.type === 'naval') {
      const z = game.map[o.zone];
      if (!z || z.type !== 'sea') { fail('not a sea zone'); continue; }
      const from = state.t[o.from];
      if (!from || !tags.includes(from.owner)) { fail('no fleet source'); continue; }
      const avail = from.strength - (committedFrom[o.from] || 0);
      if (o.strength < 1 || o.strength > avail) { fail('not enough strength'); continue; }
      if (!game.map[o.from].adjacent.includes(o.zone) && o.from !== o.zone) { fail('zone not adjacent'); continue; }
      if (o.strength > p.ratings.sea * 2) { fail('over naval capacity'); continue; }
      if (!p.atWar && o.mission !== 'escort') { fail('neutral fleet stays home'); continue; }
      committedFrom[o.from] = (committedFrom[o.from] || 0) + o.strength;
      o = { ...o, _side: sideOfOwner(state, from.owner) };
    } else if (o.type === 'entrench') {
      const t = state.t[o.territory];
      if (!t || !tags.includes(t.owner)) { fail('not yours'); continue; }
      if (!t.supplied) { fail('out of supply'); continue; }
    } else if (o.type === 'strat_card') {
      if (!p.stratHand.includes(o.cardId)) { fail('card not in hand'); continue; }
      if (kept.some(k => k.type === 'strat_card')) { fail('one strategy card per round'); continue; }
    } else if (o.type === 'ops_card') {
      if (!p.opsHand.includes(o.cardId)) { fail('card not in hand'); continue; }
      const card = game.opsCards[o.cardId];
      if (card.powers !== 'any' && !card.powers.includes(powerId)) { fail('wrong power'); continue; }
    } else if (o.type === 'lend_lease') {
      if (!state.powers[o.to] || o.to === powerId) { fail('bad recipient'); continue; }
      if (sideOfPower(state, o.to) !== sideOfPower(state, powerId)) { fail('not an ally'); continue; }
      if (hasFlag(state, 'no_lend_lease')) { fail('lend-lease blocked'); continue; }
      if (o.amount < 1 || o.amount > 4) { fail('amount 1-4'); continue; }
      if (powerId !== 'usa' && !p.atWar) { fail('neutral cannot lend-lease'); continue; }
    } else if (o.type === 'build') {
      const t = state.t[o.territory];
      if (!t || !tags.includes(t.owner)) { fail('not yours'); continue; }
      if (o.what !== 'fort' && !game.map[o.territory].industrial) { fail('not industrial'); continue; }
      if (!t.supplied) { fail('out of supply'); continue; }
    } else if (o.type === 'ultra') {
      if (powerId !== 'uk') { fail('uk only'); continue; }
    } else if (o.type === 'decisive_battle') {
      if (powerId !== 'japan' || p.decisiveUsed) { fail('unavailable'); continue; }
    } else if (o.type === 'initiative_bid') {
      // Each +1 on the side's initiative roll costs 2 coalition pool.
      const side = sideOfPower(state, powerId);
      if (o.points < 1 || o.points * 2 > state.pool[side]) { fail('pool too small (2 per point)'); continue; }
    } else if (o.type === 'pool_resupply') {
      const side = sideOfPower(state, powerId);
      const t = state.t[o.territory];
      if (state.pool[side] < 3) { fail('needs 3 coalition pool'); continue; }
      if (!t || !tags.includes(t.owner) || !t.supplied) { fail('not a supplied friendly territory'); continue; }
    } else if (o.type === 'enter_war') {
      const italyEarly = powerId === 'italy' && !p.atWar;
      if (!italyEarly && (p.atWar || p.pressure === null || p.pressure < 7)) { fail('cannot enter yet'); continue; }
    } else if (o.type === 'defect') {
      const n = state.nations[o.nation];
      if (powerId !== 'indies' || !n || n.allegiance !== 'axis' || n.pressure < 7) { fail('cannot defect'); continue; }
    } else if (o.type === 'sell_commitment') {
      const n = state.nations[o.nation];
      if (powerId !== 'indies' || !n || n.allegiance !== 'axis') { fail('not a client'); continue; }
    }

    // Budget check: a commander pot funds only orders inside its theatre.
    // `spent` may carry a half point from interior-lines moves; the budget
    // comparison rounds up so a stray half never buys a full extra order.
    const th = orderTheatre(game, o);
    let fromCmd = 0, fundingPot = null;
    if (cost >= 1 && th) {
      fundingPot = Object.values(pots).find(pot => pot.theatre === th && pot.remaining > 0) ?? null;
      if (fundingPot) fromCmd = Math.min(Math.floor(cost), fundingPot.remaining);
    }
    if (Math.ceil(spent + cost - fromCmd) > budget) { fail('over command point budget'); continue; }
    if (fundingPot) { fundingPot.remaining -= fromCmd; fundingPot.used += fromCmd; }
    spent += cost - fromCmd;
    kept.push(o);
  }
  spent = Math.ceil(spent);
  if (opts.commit) {
    state.commanderSpent = state.commanderSpent || {};
    for (const [key, pot] of Object.entries(pots)) {
      state.commanderSpent[key] = { ...(state.commanderSpent[key] || {}), [powerId]: pot.used };
    }
  }
  return { orders: kept, spent, budget, dropped };
}

function orderTheatre(game, o) {
  const tid = o.target ?? o.zone ?? o.territory ?? o.to ?? o.from ?? null;
  return tid && game.map[tid] ? game.map[tid].theatre : null;
}

// ——— the reveal (phase 4.4) ———

function reveal(game, state, rng) {
  state.battles = [];
  state.roundLog.push(`— Reveal: all order sheets turn face up —`);
  const sheets = state.orders;

  // 1. Strategy cards: ops plays give away opponent-aligned events; event plays fire.
  const eventQueue = [];
  for (const [pid, sheet] of Object.entries(sheets)) {
    if (!sheet) continue;
    for (const o of sheet.orders) {
      if (o.type !== 'strat_card') continue;
      const card = game.cards[o.cardId];
      const p = state.powers[pid];
      p.stratHand = p.stratHand.filter(c => c !== o.cardId);
      const mySide = sideOfPower(state, pid);
      const opponentAligned = card.side !== 'neutral' && card.side !== mySide;
      if (o.forOps) {
        state.roundLog.push(`${pid} plays "${card.title}" for ${card.ops} ops`);
        if (opponentAligned) eventQueue.push({ card, beneficiary: card.side, by: pid });
        else state.decks.strat.discard.push(card.id);
      } else {
        eventQueue.push({ card, beneficiary: card.side === 'neutral' ? mySide : card.side, by: pid });
      }
    }
  }
  // Events fire in initiative order (initiative side's events first).
  eventQueue.sort((a, b) =>
    (a.beneficiary === state.initiative ? 0 : 1) - (b.beneficiary === state.initiative ? 0 : 1));
  for (const ev of eventQueue) {
    // A side may cancel an opponent event for 4 pool (auto policy: cancel events
    // that hurt it most — entry/pressure bombs — if it can afford it).
    const victimSide = ev.beneficiary === 'axis' ? 'allied' : 'axis';
    const dangerous = ev.card.effects.some(e =>
      e.op === 'entry' || (e.op === 'pressure' && Math.abs(e.delta) >= 2) || e.op === 'corridor');
    if (dangerous && state.pool[victimSide] >= 6 && state.poolPolicy?.[victimSide]?.cancel !== false) {
      state.pool[victimSide] -= 4;
      state.roundLog.push(`${victimSide} spends 4 coalition pool to cancel "${ev.card.title}"`);
      state.decks.strat.discard.push(ev.card.id);
      continue;
    }
    state.roundLog.push(`Event: "${ev.card.title}" (${ev.card.side}) — ${ev.card.text}`);
    applyEffects(game, state, ev.card.effects, { by: ev.by, rng });
    if (ev.card.remove) state.decks.strat.removed.push(ev.card.id);
    else state.decks.strat.discard.push(ev.card.id);
  }

  // 2. Intel ops, pool spends, and seat specials.
  for (const [pid, sheet] of Object.entries(sheets)) {
    if (!sheet) continue;
    for (const o of sheet.orders) {
      if (o.type === 'intel_op' && o.kind === 'pressure' && o.track) {
        const delta = Math.sign(o.delta || 1);
        applyEffects(game, state, [{ op: 'pressure', track: o.track, delta }]);
      } else if (o.type === 'intel_op' && o.kind === 'deception') {
        // Two rounds: it must still be live when next round's Ultra reads.
        state.activeFlags.push({ name: 'deception', rounds: 2, power: pid });
      } else if (o.type === 'sell_commitment') {
        state.powers.indies.cpCarry = (state.powers.indies.cpCarry ?? 0) + 2;
        applyEffects(game, state, [{ op: 'pressure', track: o.nation, delta: 1 }]);
        state.roundLog.push(`Independent States sell ${o.nation}'s commitment for 2 CP (next round)`);
      } else if (o.type === 'pool_resupply') {
        const side = sideOfPower(state, pid);
        const ts = state.t[o.territory];
        if (state.pool[side] >= 3 && ts && ts.supplied) {
          state.pool[side] -= 3;
          ts.strength += 2;
          state.roundLog.push(`${pid} spends 3 ${side} coalition pool on emergency resupply at ${game.map[o.territory].name}`);
        }
      } else if (o.type === 'decisive_battle') {
        state.powers.japan.decisiveUsed = true;
        state.decisiveZone = o.zone;
        state.roundLog.push(`Japan declares a Decisive Battle in ${game.map[o.zone]?.name ?? o.zone}`);
      }
    }
  }

  // 3. Collect offensives into battles; detect joint orders; pay the pool.
  // A battle's side is its sources' allegiance (validated per order), and the
  // joint-order bonus counts DISTINCT powers — a power cannot ally with itself.
  const byTarget = {};
  for (const [pid, sheet] of Object.entries(sheets)) {
    if (!sheet) continue;
    for (const o of sheet.orders) {
      if (o.type !== 'offensive') continue;
      const side = o._side ?? sideOfPower(state, pid);
      (byTarget[o.target] = byTarget[o.target] || []).push({ power: pid, order: o, side });
    }
  }
  for (const [target, attacks] of Object.entries(byTarget)) {
    for (const side of ['axis', 'allied']) {
      const attackers = attacks.filter(a => a.side === side);
      if (!attackers.length) continue;
      const distinct = new Set(attackers.map(a => a.power)).size;
      if (distinct > 1) {
        state.pool[side] += distinct - 1;
        state.roundLog.push(
          `Joint order on ${game.map[target].name}: ${attackers.map(a => a.power).join(' + ')} ` +
          `(+${distinct - 1} ${side} coalition pool)`);
      }
      state.battles.push({ kind: 'land', target, side, attackers, opsCards: [] });
      // Japan striking south ignites the global Pacific war.
      if (side === 'axis' && attackers.some(a => a.power === 'japan')
        && ['pacific', 'seasia'].includes(game.map[target].theatre)) {
        state.japanGlobal = true;
      }
    }
  }

  // 4. Naval orders become naval battles / escorts / raids / bombing raids.
  for (const [pid, sheet] of Object.entries(sheets)) {
    if (!sheet) continue;
    for (const o of sheet.orders) {
      if (o.type !== 'naval') continue;
      state.battles.push({
        kind: o.mission === 'bomb' ? 'bomb' : 'naval',
        target: o.zone, side: o._side ?? sideOfPower(state, pid),
        attackers: [{ power: pid, order: { sources: o.mission === 'bomb' ? [] : [{ from: o.from, strength: o.strength }] }, dice: o.strength }],
        mission: o.mission ?? 'contest', opsCards: [],
      });
      if (pid === 'japan' && o.mission !== 'escort'
        && ['pacific', 'seasia'].includes(game.map[o.zone]?.theatre)) state.japanGlobal = true;
    }
  }

  // 5. Attach declared ops cards to their battles. Battle-free tradecraft
  // (intel_peek) fires immediately instead.
  for (const [pid, sheet] of Object.entries(sheets)) {
    if (!sheet) continue;
    for (const o of sheet.orders) {
      if (o.type !== 'ops_card') continue;
      const p = state.powers[pid];
      p.opsHand = p.opsHand.filter(c => c !== o.cardId);
      state.decks.opsDiscard.push(o.cardId);
      const card = game.opsCards[o.cardId];
      if (card.effect.kind === 'intel_peek') {
        applyEffects(game, state, [{ op: 'drawOps', power: pid, n: 1 }], { rng });
        state.roundLog.push(`${pid} plays "${card.title}": the signals desk pays off (+1 operations card)`);
        continue;
      }
      const battle = state.battles.find(b => b.target === (o.battle ?? ''));
      if (battle) battle.opsCards.push({ power: pid, card });
      else state.roundLog.push(`${pid}'s "${card.title}" finds no battle and is discarded`);
    }
  }

  // 6. Attacking a neutral — on land or at sea: pressure to 10, first strike
  // for one round (the counter is cleared at the reckoning).
  for (const b of state.battles) {
    if (b.kind !== 'land' && !(b.kind === 'naval' && b.mission !== 'escort')) continue;
    const owner = state.t[b.target].owner;
    if (b.kind === 'naval' && state.t[b.target].strength === 0) continue;
    const os = sideOfOwner(state, owner);
    if (os === 'neutral' && (state.powers[owner] || state.nations[owner])) {
      if (state.powers[owner]?.pressure !== null && state.powers[owner]) {
        state.powers[owner].pressure = 10;
        state.powers[owner].pressureLock = null;
      }
      if (state.nations[owner]) state.nations[owner].pressure = 10;
      for (const a of b.attackers) state.firstStrike[a.power] = 1;
      state.roundLog.push(`${b.attackers.map(a => a.power).join('+')} attack neutral ${game.map[b.target].name}: its pressure snaps to 10`);
    }
  }
}

// ——— resolution (phase 4.5) ———

function resolveRound(game, state, rng, options = {}) {
  // Initiative: d6 per side, +1 per 2 coalition pool bid.
  const bids = { axis: 0, allied: 0 };
  for (const [pid, sheet] of Object.entries(state.orders)) {
    if (!sheet) continue;
    for (const o of sheet.orders) {
      if (o.type === 'initiative_bid') {
        const side = sideOfPower(state, pid);
        const pts = Math.min(o.points, Math.floor(state.pool[side] / 2));
        state.pool[side] -= pts * 2;
        bids[side] += pts;
      }
    }
  }
  let a = rng.d6() + bids.axis, b = rng.d6() + bids.allied;
  if (a === b) state.initiative = rng.coin() === 'heads' ? 'axis' : 'allied';
  else state.initiative = a > b ? 'axis' : 'allied';
  state.roundLog.push(`Initiative: ${state.initiative} (axis ${a} vs allied ${b})`);

  // Moves execute first (all sides simultaneously). A stack keeps its owner
  // tag: French troops stay French, a defected nation's troops stay its own.
  for (const [pid, sheet] of Object.entries(state.orders)) {
    if (!sheet) continue;
    for (const o of sheet.orders) {
      if (o.type !== 'move') continue;
      const from = state.t[o.from], to = state.t[o.to];
      const amount = Math.min(o.strength, from.strength);
      if (amount <= 0) continue;
      from.strength -= amount;
      if (to.strength === 0 || to.owner === 'none') { to.owner = from.owner; }
      to.strength += amount;
      to.entrenched = false;
    }
    for (const o of sheet.orders) {
      if (o.type === 'entrench') {
        state.t[o.territory].entrenched = true;
        // Fortress engineering: entrenching can also raise a fort (+1 CP,
        // priced in orderCost via o.withFort).
        if (o.withFort && hasDoctrine(game, state, pid, 'fortification')) {
          state.t[o.territory].fort = Math.min(2, state.t[o.territory].fort + 1);
        }
      }
    }
  }

  // Commit offensive strength out of its source territories, remembering
  // whose flag the force marches under.
  for (const bt of state.battles) {
    for (const at of bt.attackers) {
      at.committed = 0;
      for (const s of at.order.sources) {
        const src = state.t[s.from];
        if (at.ownerTag === undefined) at.ownerTag = src.owner;
        const take = Math.min(s.strength, src.strength);
        src.strength -= take;
        at.committed += take;
        s.taken = take;
      }
    }
  }

  // The coin: initiative side settles exactly one contested battle without
  // dice. Each side may pre-declare its choice before any dice; the initiative
  // holder's declaration counts. The flip is marked on ONE battle object, so
  // two battles over the same territory can never both be coin-settled.
  const coinTarget = options.coinBattleBySide?.[state.initiative]
    ?? options.coinBattle ?? pickCoinBattle(game, state);
  state.coinBattle = coinTarget;
  const coinBt = state.battles.find(bt => bt.kind === 'land' && bt.target === coinTarget
    && state.t[bt.target].strength > 0);
  if (coinBt) coinBt._coin = true;

  // Resolve theatre by theatre, naval first (bombing raids after the fleets).
  for (const theatre of THEATRE_ORDER) {
    const rank = { naval: 0, bomb: 1, land: 2 };
    const here = state.battles
      .filter(bt => game.map[bt.target].theatre === theatre)
      .sort((x, y) => (rank[x.kind] - rank[y.kind]) || x.target.localeCompare(y.target));
    for (const bt of here) {
      if (bt.kind === 'bomb') resolveBombing(game, state, rng, bt);
      else resolveBattle(game, state, rng, bt, bt._coin === true);
    }
  }

  traceSupply(game, state);
}

function pickCoinBattle(game, state) {
  // Auto policy: the initiative side flips the contested battle where it
  // defends against the worst odds; failing that, the biggest contested
  // battle on the board — the GDD wants exactly one coin whenever there is

// AI has a coordination dial: a coordinated team builds a shared plan and
// writes joint orders; an uncoordinated seat plays greedy solo war. The
// simulation uses the dial to test the thesis, and solo human games use the

// Online play, exactly as GDD §12 prescribes: the page holds the board state,
// each action publishes a new version, and secret orders are commit-then-reveal.
// The commit is SHA-256(canonical orders + salt); the reveal is the text and
// the salt; every device re-hashes and checks. The round's dice seed derives
// from the hash of ALL reveals, so nobody can know the dice before the commit.

const { hashString } = __req('src/engine/rng.js');

async function sha256Hex(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}

function randomSalt() {
  const b = new Uint8Array(16);
  crypto.getRandomValues(b);
  return [...b].map(x => x.toString(16).padStart(2, '0')).join('');
}

// Canonical serialization: stable key order so the same sheet always hashes
// the same on every device.
function canonicalJson(value) {
  if (Array.isArray(value)) return '[' + value.map(canonicalJson).join(',') + ']';
  if (value && typeof value === 'object') {
    return '{' + Object.keys(value).sort()
      .map(k => JSON.stringify(k) + ':' + canonicalJson(value[k])).join(',') + '}';
  }
  return JSON.stringify(value);
}

async function commitFor(orders, salt) {
  return sha256Hex(canonicalJson(orders) + '|' + salt);
}

async function verifyReveal(orders, salt, hash) {
  return (await commitFor(orders, salt)) === hash;
}

// Derive the round's RNG seed from every revealed sheet: provably fair dice.
function roundSeed(reveals, round, gameSeed) {
  const material = Object.keys(reveals).sort()
    .map(p => p + ':' + canonicalJson(reveals[p].orders) + ':' + reveals[p].salt)
    .join('||');
  return hashString(`${gameSeed}|round${round}|${material}`);
}

function readShared() {
  const el = document.getElementById('game-state');
  if (!el || !el.textContent.trim()) return null;
  try { return JSON.parse(el.textContent); } catch { return null; }
}

// Rebuild the full page document from static parts + fresh shared state.
// The live DOM is never serialized: #app is rendered from state on load.
function pageSource(sharedJson) {
  const style = document.getElementById('app-style')?.textContent ?? '';
  const code = document.getElementById('app-code')?.textContent ?? '';
  const fonts = 'https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap';

<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coalition 1939</title>
<link rel="stylesheet" href="${fonts}">
<style id="app-style">${style}</style>
</head><body>
<div id="app"></div>
<script id="game-state" type="application/json">${esc(sharedJson)}</${'script'}>
<script id="app-code">${code}</${'script'}>
</body></html>`;

class OnlineSync {
  constructor() {
    this.artifact = null;
    this.ready = this.initPromise();
  }
  async initPromise() {
    try {
      if (typeof window !== 'undefined' && window.claude?.use) {

    } catch { this.artifact = null; }

  available() { return this.artifact !== null; }

  // A conflict means someone else published first; every view (this one

function deviceToken() {

  try { localStorage.setItem(`c39-orders-${round}-${power}`, JSON.stringify(orders)); } catch { /* ok */ }
}
function loadOrders(round, power) {
  try {
    const s = localStorage.getItem(`c39-orders-${round}-${power}`);
    return s ? JSON.parse(s) : null;
  } catch { return null; }
}
